[package]
name = "descartes-workflow"
version = "0.2.0"
edition = "2021"
description = "Visible subagent orchestration with Ralph-Wiggum loops"
license = "MIT"
repository = "https://github.com/pyrex41/descartes"
homepage = "https://github.com/pyrex41/descartes"
documentation = "https://docs.rs/descartes-workflow"
readme = "README.md"
keywords = ["ai", "agents", "orchestration", "llm", "claude"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "baml_src/**/*", "prompts/**/*", "build.rs", "Cargo.toml", "README.md"]

[[bin]]
name = "descartes"
path = "src/main.rs"

[[bin]]
name = "claude-proxy"
path = "src/bin/claude-proxy.rs"

[lib]
name = "descartes"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "process"] }
futures = "0.3"
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# HTTP client (for API harnesses)
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# HTTP server (for claude-proxy)
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# BAML - AI prompt engineering framework with native Rust codegen
baml = "0.217"

# SCUD task management
# Development: use path for latest features
# Publishing:  change to version (scud = { package = "scud-cli", version = "1.35" })
scud = { package = "scud-cli", path = "../../scud/scud-cli" }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Terminal UI
crossterm = "0.28"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
shellexpand = "3"
regex = "1"
humantime = "2"
ctrlc = "3"
shell-words = "1"

[build-dependencies]
walkdir = "2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[features]
default = []
# Future: separate harness features if needed
# opencode = []
# codex = []
